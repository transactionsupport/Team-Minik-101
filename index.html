<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Team Minik 101 Assistant</title>
<meta name="robots" content="noindex">
<style>
:root{--navy:#0d2240;--navy2:#16335c;--accent:#2f6fd6;--bg:#f3f5f9;--card:#fff;--ink:#1b2430;--muted:#66728a;--line:#e2e7ef;--hl:#fff1b8}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--ink);background:var(--bg);display:flex;flex-direction:column}
header{background:var(--navy);color:#fff;padding:14px 20px;display:flex;align-items:center;gap:12px;flex:none}
.logo{width:38px;height:38px;border-radius:9px;background:#fff;color:var(--navy);display:grid;place-items:center;font-weight:800;font-size:15px;letter-spacing:-.5px}
header h1{font-size:17px;margin:0;font-weight:650}
header p{margin:0;font-size:12.5px;opacity:.75}
header a{margin-left:auto;color:#fff;opacity:.8;font-size:13px;text-decoration:none;border:1px solid rgba(255,255,255,.35);padding:6px 10px;border-radius:8px;white-space:nowrap}
header a:hover{opacity:1}
#chat{flex:1;overflow-y:auto;padding:22px 16px 8px}
.wrap{max-width:780px;margin:0 auto}
.msg{display:flex;margin:0 0 16px}
.msg.user{justify-content:flex-end}
.bubble{max-width:100%;border-radius:14px;padding:12px 15px}
.user .bubble{background:var(--accent);color:#fff;border-bottom-right-radius:4px;max-width:80%}
.bot .bubble{background:var(--card);border:1px solid var(--line);border-bottom-left-radius:4px;width:100%}
.bot .bubble>p{margin:0 0 8px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{border:1px solid var(--line);background:#f7f9fc;color:var(--navy2);border-radius:999px;padding:6px 12px;font-size:13.5px;cursor:pointer;font-family:inherit}
.chip:hover{border-color:var(--accent);color:var(--accent);background:#fff}
.answer{background:#eef4ff;border:1px solid #cfe0ff;border-radius:10px;padding:12px 14px;margin:2px 0 12px}
.answer h3{margin:0 0 6px;font-size:15px;color:var(--navy)}
.answer .body{font-size:14.5px}
.answer a{color:var(--accent)}
.src{font-size:12.5px;color:var(--muted);margin-top:8px}
.src a{color:var(--muted)}
.grp{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:650;margin:12px 0 6px}
.res{display:flex;gap:11px;padding:9px 6px;border-radius:9px;text-decoration:none;color:inherit;align-items:flex-start}
.res:hover{background:#f4f7fc}
.badge{flex:none;font-size:10px;font-weight:700;letter-spacing:.04em;border-radius:5px;padding:3px 0;width:50px;text-align:center;margin-top:2px}
.b-pdf{background:#fde8e8;color:#b42318}.b-video{background:#f1e8fd;color:#6b2bb8}.b-sheet{background:#e5f6ea;color:#1c7a3d}
.b-doc,.b-file{background:#e6effd;color:#1f5fbf}.b-slides{background:#fff1dc;color:#a65d00}.b-page{background:var(--navy);color:#fff}.b-link{background:#edf0f4;color:#4a5568}
.res .t{font-weight:600;color:var(--navy);word-break:break-word}
.res .m{font-size:12.5px;color:var(--muted)}
.res .snip{font-size:13.5px;color:#3d4a5c;margin-top:3px}
mark{background:var(--hl);color:inherit;padding:0 1px;border-radius:2px}
.more{margin-top:6px;background:none;border:none;color:var(--accent);cursor:pointer;font:inherit;font-size:13.5px;padding:4px 6px}
footer{flex:none;background:var(--bg);padding:10px 16px 16px}
form{display:flex;gap:8px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:6px 6px 6px 14px;box-shadow:0 2px 10px rgba(13,34,64,.06)}
input{flex:1;border:none;outline:none;font:inherit;font-size:16px;background:transparent;color:var(--ink);min-width:0}
button.send{border:none;background:var(--navy);color:#fff;border-radius:10px;padding:9px 16px;font:inherit;font-weight:600;cursor:pointer}
button.send:hover{background:var(--navy2)}
.note{font-size:11.5px;color:var(--muted);text-align:center;margin-top:8px}
@media(max-width:560px){header a{display:none}.badge{width:44px}}
</style>
</head>
<body>
<header>
  <div class="logo">TM</div>
  <div><h1>Team Minik 101 Assistant</h1><p>Ask for any training, script, form or guide</p></div>
  <a href="https://sites.google.com/teamminik.com/team-minik-101/home" target="_blank" rel="noopener">Open full site ↗</a>
</header>
<div id="chat"><div class="wrap" id="log"></div></div>
<footer><div class="wrap">
  <form id="f" autocomplete="off"><input id="q" placeholder="e.g. expired listing script, open house kit, CINC dialer…" aria-label="Ask a question"><button class="send">Ask</button></form>
  <div class="note">Answers come from the Team Minik 101 site. Some files open only when you're signed in to your teamminik.com Google account.</div>
</div></footer>
<script>
const SUGGEST=["Expired / cancelled listing scripts","Open house kit list","How do I set up the printer?","CINC dialer training","Buyer presentation","Listing appointment","Preferred lenders","Contract writing class","My business card","Logos","FSBO script","What do I need for a new listing?"];
const STOP=new Set("a an the and or of to for in on at by with from is are be do does i me my we our you your it this that what where how can find need show get give want looking look any some about please there have has team minik".split(" "));
const SYN={expired:["expired","cancel","cancelled","canceled","cxl"],cancel:["cancel","cancelled","canceled","cxl","expired"],cxl:["cxl","cancelled","expired"],fsbo:["fsbo","sale by owner"],
 printer:["printer","print","ricoh"],print:["print","printer"],lender:["lender","mortgage","loan","financing","fairway","reasy"],loan:["loan","lender","mortgage","financing"],mortgage:["mortgage","lender","loan"],
 cma:["cma","comps","comparable"],comps:["comps","cma","comparable"],mls:["mls","armls","flexmls"],flexmls:["flexmls","armls","mls"],
 logo:["logo","logos"],sign:["sign","signs","riders","posts"],rider:["rider","riders","qr"],photo:["photo","photography","photos"],
 video:["video","videos","mp4","recording"],training:["training","class","recorded"],class:["class","training"],
 script:["script","scripts","dialogue"],objection:["objection","objections"],offer:["offer","offers","contract","counter"],contract:["contract","offer"],
 flyer:["flyer","flyers","brochure"],brochure:["brochure","flyer"],buyer:["buyer","buyers"],seller:["seller","sellers","listing"],listing:["listing","listings","seller"],
 contact:["contact","contacts","phone","directory"],phone:["phone","contact","grasshopper"],hashtag:["hashtag","hashtags"],lockbox:["lockbox","supra"],
 social:["social","facebook","instagram","youtube","media"],facebook:["facebook","social"],instagram:["instagram","social"],
 probate:["probate"],divorce:["divorce"],investor:["investor","investors"],condo:["condo","condos"],warranty:["warranty","orhp"],
 tc:["tc","transaction","coordinator"],transaction:["transaction","transactions","tc"],dialer:["dialer","dial","voip"],
 business:["business"],card:["card","cards"],packet:["packet","packets"],presentation:["presentation","appointment"],
 qr:["qr"],sisu:["sisu"],cinc:["cinc"],kcm:["kcm"],homebot:["homebot"],bombbomb:["bombbomb","bomb"],altos:["altos","market report"],
 report:["report","reports"],market:["market"],farm:["farm","farming"],farming:["farming","farm"],buydown:["buydown","buy down","rate"],
 assumable:["assumable","assume"],dpa:["dpa","down payment"],spanish:["spanish"],city:["city","cities"],cities:["cities","city"]};
const TYPE={pdf:"PDF",video:"VIDEO",sheet:"SHEET",doc:"DOC",slides:"SLIDES",file:"FILE",link:"LINK",page:"PAGE"};
let KB=[];
const log=document.getElementById('log'),chat=document.getElementById('chat');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const norm=s=>(s||"").toLowerCase().replace(/[’']/g,"").replace(/[^a-z0-9]+/g," ").trim();
const stem=w=>w.length>4?w.replace(/(ings|ing|ies|es|s|ed)$/,""):w;
function prep(){KB.forEach(it=>{it._n=norm(it.n);it._s=norm((it.s||"")+" "+(it.k||""));it._c=norm(it.c);it._x=norm(it.x||"");});}
function terms(q){
  const words=norm(q).split(" ").filter(w=>w&&!STOP.has(w));
  return words.map(w=>{const set=new Set([w,stem(w)]);(SYN[w]||SYN[stem(w)]||[]).forEach(s=>set.add(s));return [...set].filter(Boolean);});
}
function has(text,v){if(!text)return false;if(v.includes(" "))return text.includes(v);return (" "+text+" ").includes(" "+v)||(v.length>=4&&text.includes(v));}
function score(it,T,qn){
  let total=0,hit=0;
  for(const alts of T){
    let best=0;
    for(const v of alts){
      let s=0;
      if(has(it._n,v))s+=6;
      if(has(it._s,v))s+=it.t==="answer"?6:3;
      if(has(it._c,v))s+=2.5;
      if(it._x&&has(it._x,v))s+=1.2;
      if(v!==alts[0])s*=.8;
      best=Math.max(best,s);
    }
    if(best>0)hit++;total+=best;
  }
  if(!T.length)return 0;
  const cov=hit/T.length;
  total*=cov*cov;
  if(qn.length>3&&it._n.includes(qn))total+=8;
  if(it.t==="answer")total*=1.25;
  if(it.t==="page")total*=1.1;
  return total;
}
function snippet(x,T){
  if(!x)return "";
  const low=x.toLowerCase();let pos=-1;
  for(const alts of T){for(const v of alts){const i=low.indexOf(v);if(i>=0&&(pos<0||i<pos))pos=i;}}
  if(pos<0)return "";
  let st=Math.max(0,pos-80),en=Math.min(x.length,pos+170);
  let s=(st>0?"… ":"")+x.slice(st,en)+(en<x.length?" …":"");
  return hl(s,T);
}
function hl(s,T){
  let out=esc(s);
  const vs=[...new Set(T.flat())].filter(v=>v.length>2).sort((a,b)=>b.length-a.length);
  if(!vs.length)return out;
  const re=new RegExp("("+vs.map(v=>v.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")).join("|")+")","gi");
  return out.replace(re,"<mark>$1</mark>");
}
function add(cls,html){const d=document.createElement('div');d.className="msg "+cls;d.innerHTML='<div class="bubble">'+html+'</div>';log.appendChild(d);chat.scrollTop=chat.scrollHeight;return d;}
function chips(list){return '<div class="chips">'+list.map(s=>'<button class="chip" data-q="'+esc(s)+'">'+esc(s)+'</button>').join("")+'</div>';}
function row(it,T){
  const meta=it.t==="page"?it.c:(it.s?it.s+" · ":"")+it.c;
  const sn=it.t==="page"?snippet(it.x,T):"";
  return '<a class="res" href="'+esc(it.u)+'" target="_blank" rel="noopener"><span class="badge b-'+it.t+'">'+TYPE[it.t]+'</span><span><div class="t">'+hl(it.n,T)+'</div><div class="m">'+esc(meta)+'</div>'+(sn?'<div class="snip">'+sn+'</div>':'')+'</span></a>';
}
function answer(q){
  const T=terms(q),qn=norm(q);
  if(!T.length){add("bot","<p>Tell me what you're looking for — a script, form, training video, guide or link.</p>"+chips(SUGGEST.slice(0,6)));return;}
  const ranked=KB.map(it=>({it,s:score(it,T,qn)})).filter(r=>r.s>1.5).sort((a,b)=>b.s-a.s);
  if(!ranked.length){
    add("bot","<p>I couldn't find anything on the Team Minik 101 site for <b>"+esc(q)+"</b>. Try different words, or browse a section:</p>"+
    '<div class="chips">'+[["Buyers","buyers"],["Sellers","sellers"],["Open House","open-house"],["Scripts","resources/scripts"],["Guides/FAQs","resources/guidesfaqs"],["Vendors/Partners","resources/vendorspartners"],["Recorded Trainings","training/recorded-trainings"]].map(([n,p])=>'<a class="chip" style="text-decoration:none" target="_blank" href="https://sites.google.com/teamminik.com/team-minik-101/'+p+'">'+n+' ↗</a>').join("")+'</div>');
    return;
  }
  const top=ranked[0].s;
  const strong=ranked.filter(r=>r.s>=top*0.35);
  let html="";
  const ans=strong.find(r=>r.it.t==="answer"&&r.s>=top*0.6);
  if(ans){html+='<div class="answer"><h3>'+esc(ans.it.n)+'</h3><div class="body">'+ans.it.a+'</div><div class="src">Source: <a href="'+esc(ans.it.u)+'" target="_blank" rel="noopener">'+esc(ans.it.c)+' ↗</a></div></div>';}
  const rest=strong.filter(r=>r.it.t!=="answer");
  const pages=rest.filter(r=>r.it.t==="page").slice(0,3);
  const others=rest.filter(r=>r.it.t!=="page");
  if(!ans)html+='<p>'+(others.length+pages.length>1?"Here's what I found":"Here's the best match")+' for <b>'+esc(q)+'</b>:</p>';
  if(others.length){html+='<div class="grp">Files, videos &amp; links</div>'+others.slice(0,7).map(r=>row(r.it,T)).join("");}
  if(pages.length){html+='<div class="grp">Site pages</div>'+pages.map(r=>row(r.it,T)).join("");}
  const d=add("bot",html);
  if(others.length>7){
    const b=document.createElement('button');b.className="more";b.textContent="Show "+(others.length-7)+" more";
    b.onclick=()=>{b.insertAdjacentHTML('beforebegin',others.slice(7,40).map(r=>row(r.it,T)).join(""));b.remove();};
    const grp=d.querySelectorAll('.grp')[0];
    (pages.length?d.querySelectorAll('.grp')[1]:null)?d.querySelectorAll('.grp')[1].before(b):d.querySelector('.bubble').appendChild(b);
  }
}
function ask(q){q=q.trim();if(!q)return;add("user",esc(q));answer(q);}
document.getElementById('f').addEventListener('submit',e=>{e.preventDefault();const i=document.getElementById('q');ask(i.value);i.value="";});
log.addEventListener('click',e=>{const c=e.target.closest('button.chip');if(c)ask(c.dataset.q);});
add("bot","<p>Hi! I'm the <b>Team Minik 101</b> assistant. Ask me for any script, training video, form, guide or vendor on the site and I'll pull it up for you.</p><p style=\"margin:0\">Try one of these:</p>"+chips(SUGGEST));
fetch("kb.json?v="+Date.now()).then(r=>r.json()).then(d=>{KB=d;prep();const p=new URLSearchParams(location.search).get("q");if(p)ask(p);})
.catch(()=>add("bot","<p>Sorry — the knowledge base didn't load. Please refresh the page.</p>"));
</script>
</body>
</html>
